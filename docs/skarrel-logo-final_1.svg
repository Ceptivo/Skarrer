<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Poppins','Segoe UI',sans-serif">
  <rect width="900" height="500" fill="#f5f6f7"/>

  <text x="40" y="45" font-size="20" font-weight="700" fill="#111827">Skarrel — Primary Logo Lockup</text>

  <!-- Main lockup: icon + wordmark -->
  <rect x="40" y="90" width="820" height="220" rx="20" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- sk icon mark -->
  <rect x="80" y="130" width="140" height="140" rx="36" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="150" y="228" font-size="78" font-weight="800" text-anchor="middle" letter-spacing="-3">
    <tspan fill="#0f766e">s</tspan><tspan fill="#ff7a59">k</tspan>
  </text>

  <!-- Wordmark -->
  <text x="250" y="222" font-size="86" font-weight="800" fill="#0f766e" letter-spacing="-1">Ska<tspan fill="#ff7a59">rr</tspan>el</text>

  <!-- Tagline -->
  <text x="250" y="258" font-size="20" fill="#6b7280" font-style="italic">Skarrel smart. Save more.</text>

  <!-- App icon only, for reference -->
  <text x="40" y="360" font-size="16" fill="#6b7280">App icon (mark only)</text>
  <rect x="40" y="375" width="90" height="90" rx="24" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="85" y="435" font-size="46" font-weight="800" text-anchor="middle" letter-spacing="-2">
    <tspan fill="#0f766e">s</tspan><tspan fill="#ff7a59">k</tspan>
  </text>

  <!-- Palette reference -->
  <text x="170" y="365" font-size="16" fill="#6b7280">Palette</text>
  <rect x="170" y="380" width="50" height="34" rx="8" fill="#0f766e"/>
  <text x="170" y="428" font-size="12" fill="#374151">Teal #0F766E</text>
  <rect x="240" y="380" width="50" height="34" rx="8" fill="#ff7a59"/>
  <text x="240" y="428" font-size="12" fill="#374151">Coral #FF7A59</text>
</svg>
